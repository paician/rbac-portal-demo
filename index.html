<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3a2418">
  <meta name="description" content="Finance SSC Portal RBAC 互動式原型">
  <title>Finance SSC Portal｜RBAC Prototype</title>
  <link rel="stylesheet" href="./vendor/tabler/1.4.0/tabler.min.css">
  <link rel="stylesheet" href="./styles/fin-tokens.css">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./styles/r3-shell.css">
</head>
<body>
  <div class="app-shell" id="appShell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-inner">
        <button id="aboutButton" class="about-button" type="button">?</button>
        <div class="brand">
          <div class="brand-mark">F</div>
          <div class="brand-copy"><div class="brand-title">FIN-SSC</div><div id="brandSubtitle" class="brand-subtitle"></div></div>
        </div>
        <div id="environmentMarkers" class="environment-markers">
          <span id="prototypeMarker" class="badge"></span>
          <span id="syntheticMarker" class="badge"></span>
        </div>
        <section id="surfaceControl" class="surface-control" hidden>
          <span id="surfaceControlLabel" class="surface-control-label"></span>
          <div id="surfaceSwitcher" class="surface-switcher nav nav-pills" role="group"></div>
        </section>
        <section id="runtimeWarning" class="runtime-warning runtime-sidebar" hidden>
          <button id="runtimeWarningToggle" class="runtime-warning-toggle" type="button" aria-expanded="false" aria-controls="runtimeWarningPanel">
            <span class="runtime-warning-icon" aria-hidden="true">!</span>
            <span id="runtimeWarningLabel" class="runtime-warning-label"></span>
          </button>
          <div id="runtimeWarningPanel" class="runtime-warning-panel" hidden>
            <div class="runtime-warning-heading">
              <div><div id="runtimeWarningEyebrow" class="eyebrow"></div><strong id="runtimeWarningTitle"></strong></div>
              <span id="runtimeAuthorizationBadge" class="runtime-status-badge"></span>
            </div>
            <dl class="runtime-warning-grid">
              <div><dt id="runtimeAuthorizationLabel"></dt><dd id="runtimeAuthorizationValue"></dd></div>
              <div><dt id="runtimeCacheStateLabel"></dt><dd id="runtimeCacheStateValue"></dd></div>
              <div><dt id="runtimeCacheAgeLabel"></dt><dd id="runtimeCacheAgeValue"></dd></div>
              <div><dt id="runtimeMaxStaleLabel"></dt><dd id="runtimeMaxStaleValue"></dd></div>
              <div><dt id="runtimeLastReconciliationLabel"></dt><dd id="runtimeLastReconciliationValue"></dd></div>
            </dl>
            <div id="runtimeWarningBoundary" class="runtime-warning-boundary"></div>
          </div>
        </section>
        <nav id="sideNav" class="side-nav nav flex-column"></nav>
        <div class="sidebar-footer">FIN-SSC RBAC Demo<br><span id="syntheticLabel"></span></div>
        <section id="identityCard" class="identity-card identity-floating identity-sidebar">
          <button id="identityToggle" class="identity-toggle" type="button" aria-expanded="false" aria-controls="identityPanel">
            <span id="identityAvatar" class="identity-avatar">E</span>
            <span class="identity-compact-copy">
              <span id="identityName" class="identity-compact-name"></span>
              <span id="identityRole" class="role-badge"></span>
            </span>
            <span class="identity-caret" aria-hidden="true">⌄</span>
          </button>
          <div id="identityPanel" class="identity-panel" hidden>
            <div class="identity-panel-heading">
              <span class="identity-avatar panel-avatar">E</span>
              <div><strong id="identityPanelName"></strong><span id="identityPanelRole" class="role-badge"></span></div>
            </div>
            <dl class="identity-grid">
              <div><dt id="labelLarkName"></dt><dd id="profileName"></dd></div>
              <div><dt id="labelDepartment"></dt><dd id="profileDepartment"></dd></div>
              <div><dt id="labelBrand"></dt><dd id="profileBrand"></dd></div>
              <div><dt id="labelTitle"></dt><dd id="profileTitle"></dd></div>
            </dl>
          </div>
        </section>
      </div>
      <button id="sidebarCollapse" class="sidebar-collapse r3-sidebar-boundary-control" type="button" aria-controls="sidebar" aria-expanded="true">‹</button>
    </aside>
    <div id="mobileNavBackdrop" class="mobile-nav-backdrop" hidden></div>

    <main class="main-content container-xl">
      <header class="topbar">
        <div class="global-shell-bar d-flex">
          <div class="mobile-topbar-row"><button id="mobileMenuButton" class="mobile-menu-button btn" type="button">☰</button><strong>FIN-SSC</strong></div>
          <label class="locale-control" for="localeSwitcher">
            <span class="locale-icon" aria-hidden="true">🌐</span>
            <span id="localeSwitcherLabel" class="visually-hidden"></span>
            <select id="localeSwitcher" class="locale-switcher" autocomplete="off">
              <option value="zh-TW">繁體中文</option>
              <option value="zh-CN">简体中文</option>
              <option value="en-US">English</option>
            </select>
          </label>
        </div>
        <div class="surface-heading">
          <div><div id="surfaceEyebrow" class="eyebrow"></div><h1 id="surfaceTitle"></h1><p id="surfaceDescription"></p></div>
          <span id="surfaceAdminBadge" class="surface-context-badge badge" hidden></span>
        </div>
        <section id="roleControl" class="role-control" hidden>
          <div id="roleEyebrow" class="eyebrow"></div>
          <div class="preview-controls d-flex flex-wrap gap-2">
            <div id="roleSwitcher" class="role-switcher"></div>
            <button id="previewExit" class="preview-exit-button btn" type="button" data-preview-exit="true" hidden></button>
          </div>
          <p id="roleHelper" class="role-helper"></p>
        </section>
      </header>

      <section id="permissionNotice" class="permission-notice" hidden role="status" aria-live="polite">
        <div class="permission-notice-icon" aria-hidden="true">!</div>
        <div class="permission-notice-copy">
          <strong id="permissionNoticeTitle"></strong>
          <p id="permissionNoticeBody"></p>
          <small id="permissionNoticeBoundary"></small>
        </div>
        <button id="permissionNoticeAction" class="permission-notice-action" type="button"></button>
      </section>

      <section id="homeView" class="page-view">
        <section class="welcome-card">
          <div id="welcomeIcon" class="welcome-icon">E</div>
          <div class="welcome-copy"><div id="homeEyebrow" class="eyebrow"></div><h1 id="welcomeTitle"></h1><p id="welcomeText"></p></div>
          <div class="landscape"><span class="sun"></span><span class="ridge ridge-back"></span><span class="ridge ridge-front"></span></div>
        </section>
        <section id="metricGrid" class="metric-grid"></section>
        <section class="panel resource-panel card fin-surface-card">
          <div class="panel-heading"><div><div id="catalogEyebrow" class="eyebrow"></div><h2 id="catalogTitle"></h2><p id="catalogSubtitle"></p></div><span id="resourceCount" class="count-chip"></span></div>
          <div class="table-wrap"><table><thead><tr><th id="resourceSystemHeader"></th><th id="resourceCategoryHeader"></th><th id="resourceDescriptionHeader"></th><th id="resourceAccessHeader"></th><th id="resourceActionHeader"></th></tr></thead><tbody id="resourceRows"></tbody></table></div>
          <div id="mobileResourceList" class="mobile-resource-list"></div>
        </section>
        <section id="reservedCapabilities" class="reserved-capabilities card fin-surface-card">
          <div class="reserved-capabilities-heading"><div><div id="reservedEyebrow" class="eyebrow"></div><h2 id="reservedTitle"></h2><p id="reservedDescription"></p></div><span id="reservedBadge" class="badge"></span></div>
          <div id="reservedCapabilityGrid" class="row g-3"></div>
        </section>
        <section id="comparisonPanel" class="panel" hidden>
          <div class="panel-heading"><div><div id="comparisonEyebrow" class="eyebrow"></div><h2 id="comparisonTitle"></h2><p id="comparisonSubtitle"></p></div><span id="comparisonAdminChip" class="admin-chip"></span></div>
          <div class="table-wrap"><table class="comparison-table"><thead id="comparisonHead"></thead><tbody id="comparisonRows"></tbody></table></div>
          <div class="legend"><span class="status yes">✓</span><span id="legendYes"></span><span class="status no">—</span><span id="legendNo"></span></div>
        </section>
        <section class="prototype-note"><strong id="prototypeTitle"></strong><span id="prototypeBody"></span></section>
      </section>

      <section id="adminOverviewView" class="page-view" hidden>
        <section class="page-hero admin-overview-hero"><div><div id="adminOverviewEyebrow" class="eyebrow"></div><h1 id="adminOverviewTitle"></h1><p id="adminOverviewDescription"></p></div><span id="adminOverviewBadge" class="hero-badge"></span></section>
        <div id="adminOverviewGrid" class="admin-overview-grid row g-3"></div>
      </section>

      <section id="resourceSettingsView" class="page-view" hidden>
        <section class="page-hero"><div><div id="settingsEyebrow" class="eyebrow"></div><h1 id="settingsTitle"></h1><p id="settingsSubtitle"></p></div><span id="settingsHeroBadge" class="hero-badge"></span></section>
        <section class="panel settings-shell"><div id="settingsTabs" class="settings-tabs"></div><div id="settingsContent" class="settings-content"></div></section>
      </section>

      <section id="peopleOverviewView" class="page-view" hidden>
        <section class="page-hero"><div><div id="peopleEyebrow" class="eyebrow"></div><h1 id="peopleTitle"></h1><p id="peopleSubtitle"></p></div><span id="peopleHeroBadge" class="hero-badge"></span></section>
        <section class="panel directory-panel">
          <div class="directory-toolbar">
            <label class="search-field"><span aria-hidden="true">⌕</span><input id="peopleSearch" type="search" autocomplete="off"></label>
            <select id="peopleDepartmentFilter" class="filter-select"><option value=""></option></select>
            <div id="peopleViewMode" class="view-segment" role="group"><button id="peopleAllMode" class="segment-button active" type="button"></button><button id="peopleGroupMode" class="segment-button" type="button"></button></div>
            <span id="peopleResultCount" class="directory-count"></span>
          </div>
          <div id="peopleAllList">
            <div class="table-wrap people-table-wrap"><table><thead id="peopleHead"></thead><tbody id="peopleRows"></tbody></table></div>
            <div id="mobilePeopleList" class="mobile-people-list"></div>
          </div>
          <div id="peopleGroupedList" class="people-grouped-list" hidden></div>
          <div class="pagination-bar"><button id="peoplePrev" class="secondary-button" type="button"></button><span id="peoplePageStatus"></span><button id="peopleNext" class="secondary-button" type="button"></button></div>
        </section>
      </section>

      <section id="principalWorkbenchView" class="page-view" hidden>
        <div id="principalWorkbenchContent"></div>
      </section>

      <section id="auditView" class="page-view" hidden>
        <section class="page-hero"><div><div id="auditEyebrow" class="eyebrow"></div><h1 id="auditTitle"></h1><p id="auditSubtitle"></p></div><span id="auditHeroBadge" class="hero-badge"></span></section>
        <section class="panel audit-panel">
          <div class="audit-boundary" id="auditBoundary"></div>
          <div class="directory-toolbar">
            <label class="search-field"><span aria-hidden="true">⌕</span><input id="auditSearch" type="search" autocomplete="off"></label>
            <select id="auditTypeFilter" class="filter-select"><option value=""></option></select>
            <span id="auditResultCount" class="directory-count"></span>
          </div>
          <div class="table-wrap audit-table-wrap"><table><thead id="auditHead"></thead><tbody id="auditRows"></tbody></table></div>
          <div id="mobileAuditList" class="mobile-audit-list"></div>
          <div class="pagination-bar"><button id="auditPrev" class="secondary-button" type="button"></button><span id="auditPageStatus"></span><button id="auditNext" class="secondary-button" type="button"></button></div>
        </section>
      </section>
    </main>
  </div>

  <dialog id="aboutDialog" class="about-dialog">
    <form method="dialog" class="about-dialog-card">
      <div class="about-dialog-mark">?</div><div id="aboutSubtitle" class="eyebrow"></div><h2 id="aboutTitle"></h2><p id="aboutBody"></p><div id="aboutBoundary" class="about-boundary"></div><button id="aboutClose" class="secondary-button" value="close"></button>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./app.bundle.js"></script>
</body>
</html>
